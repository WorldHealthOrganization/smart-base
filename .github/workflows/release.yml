name: Publication Request on Release

# WHO copy (WorldHealthOrganization/smart-base): keeps WHO's automatic triggers.
# litlfred/smart-base runs this by hand only (its owner decision, 2026-10-06);
# the WHO repository builds and publishes on these events as before.
on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      file_exists: ${{ steps.checkfile.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check for publication-request.json
        id: checkfile
        run: |
          if [[ -f "publication-request.json" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  trigger:
    needs: check
    if: needs.check.outputs.file_exists == 'true'
    # smart-html's release.yml asks for contents and pull-requests write; a
    # called workflow can only get what its caller grants (WHO publication flow).
    permissions:
      contents: write
      pull-requests: write
    uses: WorldHealthOrganization/smart-html/.github/workflows/release.yml@4191acf30bd22abb4955952c53f51bb475b1c3d7 # main
#    with:
#      tag_name: ${{ github.event.release.tag_name }}
